[workspace]
members = [
    "trustfall",
    "trustfall_core",
    "trustfall_testbin",
    "trustfall_filetests_macros",
    "trustfall_derive",
    "trustfall_stubgen",
    "trustfall_wasm",
    "pytrustfall",
    "demo-hytradboi",
    "experiments/schemaless",
    "experiments/schemaless_wasm",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
authors = ["Predrag Gruevski <obi1kenobi82@gmail.com>"]
license = "Apache-2.0"

[workspace.dependencies]
# The dependencies below are part of our public API.
# Bumping a major version here requires our own major version bump.
anyhow = "1.0.104"
async-graphql-parser = "7.2"
async-graphql-value = "7.2"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
regex = "1.13.1"

# The dependencies below are internal-only.
# Bumping major versions here should be safe.
itertools = "0.15.0"
ron = "0.12.3"
similar-asserts = "2.0.0"
maplit = "1.0.2"
syn = "3.0.9"
quote = "1.0"
proc-macro2 = "1.0.107"
globset = "0.4.21"
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
